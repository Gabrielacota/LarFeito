name: lar_feito
description: Lar Feito - colaboração em família (autenticação com Strategy + SOLID)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  image_picker: ^1.1.2
  cloud_firestore: ^6.10.2
  firebase_storage: ^13.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logoBranca.png
    - assets/images/ararinhaInicia.png
    - assets/images/ararinhaFala.png
    - assets/images/ararinhaVoa.png
    - assets/images/ararinhaComemorando.png
    - assets/images/ararinhaTopo.png